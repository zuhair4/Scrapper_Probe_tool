<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
    <radialGradient id="glow" cx="32" cy="32" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#86BC25" stop-opacity=".45"/>
      <stop offset="1" stop-color="#86BC25" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EB22"/>
      <stop offset="100%" stop-color="#86BC25"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#18181b"/>
    <circle cx="32" cy="32" r="24" fill="url(#glow)"/>
    <!-- Outer probe radar pulse -->
    <circle cx="32" cy="32" r="23" fill="none" stroke="#86BC25" stroke-opacity=".3" stroke-width="1.2" stroke-dasharray="3 3"/>
    
    <!-- Isometric Toolkit / Node Module -->
    <g stroke="#18181b" stroke-width="1.5" stroke-linejoin="round">
      <!-- Top Face -->
      <path d="M32 15 L48 24 L32 33 L16 24 Z" fill="url(#topFace)"/>
      <!-- Left Face -->
      <path d="M16 24 L32 33 L32 49 L16 40 Z" fill="url(#leftFace)"/>
      <!-- Right Face (Accent) -->
      <path d="M32 33 L48 24 L48 40 L32 49 Z" fill="url(#rightFace)"/>
    </g>
    
    <!-- Central Node Connector Dot -->
    <circle cx="32" cy="33" r="3.5" fill="#18181b"/>
    <circle cx="32" cy="33" r="2" fill="#FFFFFF"/>
  </g>
</svg>
